<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0B0806">
<title>Offline · Bite Book</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; height: 100%; }
  body {
    background: #0B0806;
    color: #F4EFE5;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 2rem 1.5rem;
    text-align: center;
    -webkit-font-smoothing: antialiased;
    -webkit-tap-highlight-color: rgba(176, 108, 60, 0.25);
  }
  .card { max-width: 26rem; width: 100%; }
  .eyebrow {
    text-transform: uppercase;
    letter-spacing: 0.18em;
    font-size: 0.75rem;
    font-weight: 700;
    color: rgba(244, 239, 229, 0.6);
    margin: 0 0 0.5rem;
  }
  h1 { font-size: 1.75rem; margin: 0 0 0.75rem; line-height: 1.1; }
  p {
    margin: 0 0 1rem;
    color: rgba(244, 239, 229, 0.85);
    line-height: 1.5;
  }
  .actions {
    display: flex;
    flex-direction: column;
    gap: 0.6rem;
    align-items: stretch;
    margin-top: 1.5rem;
  }
  .btn {
    border: none;
    padding: 0.85rem 1.25rem;
    border-radius: 0.5rem;
    font-weight: 700;
    font-size: 1rem;
    min-height: 50px;
    width: 100%;
    font-family: inherit;
    text-decoration: none;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
  }
  .btn-primary { background: #B06C3C; color: #FFFFFF; }
  .btn-primary:active { background: #8C5530; }
  .btn-secondary {
    background: transparent;
    color: #F4EFE5;
    border: 1px solid rgba(244, 239, 229, 0.3);
  }
  .btn-secondary:active { background: rgba(244, 239, 229, 0.12); }
  /* Form-submit "reload" button — same look as a real <button>. */
  .reload-form { margin: 0; padding: 0; }
  .hint {
    margin-top: 1.5rem;
    font-size: 0.78rem;
    color: rgba(244, 239, 229, 0.5);
    line-height: 1.5;
  }
</style>
</head>
<body>
  <div class="card">
    <p class="eyebrow">Bite Book</p>
    <h1>You&rsquo;re offline</h1>
    <p>Tap a saved page below to keep working. We&rsquo;ll reload automatically when you reconnect.</p>
    <!--
      v27.6.4.2 — Flavio testing (after v27.6.4.1): "I'm seeing the
      new buttons but I can't progress from this screen. It won't let
      me continue using the pwa." Diagnosis: <button type="button">
      with addEventListener click handlers has no native fallback —
      if the inline <script> doesn't execute on the served offline
      page (iOS standalone PWA quirk with cached responses, or any
      future CSP tightening), tapping the button does literally
      nothing.
      Fix: replace JS-driven buttons with native anchors and a form-
      submit reload. iOS PWA standalone respects same-origin <a href>
      navigations and form submits unconditionally — they don't need
      JS to function. The SW intercepts the resulting navigation,
      serves cached HTML if available, falls back to this same page
      otherwise. Each link is independently functional.
      Hunter and guide both get a dashboard button — one will be
      cached for any signed-in user. The links themselves are
      idempotent: tapping a non-cached one just re-renders this page
      so the user can try a different option.
    -->
    <div class="actions">
      <a href="/app/h" class="btn btn-primary">Open hunter dashboard</a>
      <a href="/app" class="btn btn-secondary">Open guide dashboard</a>
      <form action="" method="get" class="reload-form">
        <button type="submit" class="btn btn-secondary">Reload this page</button>
      </form>
    </div>
    <p class="hint">If a button doesn&rsquo;t take you anywhere, that page hasn&rsquo;t been saved yet. Reconnect once and Bite Book will save it for next time.</p>
  </div>
<script>
// Optional auto-reload on connectivity. If this fails (CSP, parser
// quirk, anything), the page still works — every primary action is
// a native <a> or <form>. This is purely a nice-to-have.
try {
  window.addEventListener('online', function () { location.reload(); });
} catch (e) {}
</script>
</body>
</html>
