<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0B0806">
<title>Offline · Bite Book</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; height: 100%; }
  body {
    background: #0B0806;
    color: #F4EFE5;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 2rem;
    text-align: center;
    -webkit-font-smoothing: antialiased;
  }
  .card { max-width: 26rem; width: 100%; }
  .eyebrow {
    text-transform: uppercase;
    letter-spacing: 0.18em;
    font-size: 0.75rem;
    font-weight: 700;
    color: rgba(244, 239, 229, 0.6);
    margin: 0 0 0.5rem;
  }
  h1 { font-size: 1.75rem; margin: 0 0 0.75rem; line-height: 1.1; }
  p {
    margin: 0 0 1.25rem;
    color: rgba(244, 239, 229, 0.85);
    line-height: 1.5;
  }
  button {
    background: #B06C3C;
    color: #FFFFFF;
    border: none;
    padding: 0.75rem 1.5rem;
    border-radius: 0.5rem;
    font-weight: 700;
    font-size: 1rem;
    cursor: pointer;
    min-height: 44px;
    min-width: 9rem;
  }
  button:hover { background: #C07845; }
  button:active { background: #8C5530; }
  .hint {
    margin-top: 1.5rem;
    font-size: 0.85rem;
    color: rgba(244, 239, 229, 0.55);
  }
</style>
</head>
<body>
  <div class="card">
    <p class="eyebrow">Bite Book</p>
    <h1>You&rsquo;re offline</h1>
    <p>Please reconnect to continue. Trips and wallet items you&rsquo;ve already opened will still be available from this app.</p>
    <button type="button" onclick="location.reload()">Retry</button>
    <p class="hint">If you stay offline, the back button will return you to the last page that loaded successfully.</p>
  </div>
</body>
</html>
